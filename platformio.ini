
; ---------------------------------------------------------------------------
; RS41 build environments, named <hardware><program>.
;
; These are bench/test programs, meant to run on whatever Teensy 4.1 you have
; available for exercising the RS41 library and the RSS421 sensor. They are NOT
; flight software: if one is flashed onto flight hardware (e.g. an RPU or ECU),
; that unit's flight firmware must be restored afterward.
;
; Programs:
;   Console = examples/RS41console - interactive serial console that prints
;          decoded RS41 sensor rows and offers live commands for selecting
;          parameters, setting the sample rate, an orientation table, and
;          reconditioning. Send 'h' on the USB serial console for the full
;          command list.
;   Csv  = examples/RS41csv (CSV log to SD card),
;   Passthru = examples/PassThru (USB <-> RS41 serial bridge).
; Hardware types (the <hardware> name prefix; UART/pin set per env below):
;   LPC     LPC main Teensy
;   ECU     ECU (RATS) Teensy
;   RPU     RPU (RATCHuTS) Teensy
;   Teensy  bare Teensy 4.1, with adapter cable
; Flags: RS41SERIAL = Teensy UART wired to the RS41; RS41EN = its enable pin;
;        RATSRS41 = RATS carrier board, assert enable early (see RS41console.cpp).
; All targets are Teensy 4.1. Only deployed combinations are defined.
;
; Teensy adapter cable: an RSS421 6-pin connector on one end, 4 wires soldered
; directly to the Teensy 4.1 on the other. Wired for Serial1; the RSS421 is
; powered from the Teensy 5V rail, so RS41EN is not connected (its value in the
; Teensy* envs is a don't-care):
;   RSS421 pin 1 (TX)   -> Teensy pin 0  (RX1)
;   RSS421 pin 2 (RX)   -> Teensy pin 1  (TX1)
;   RSS421 pin 5 (+5V)  -> Teensy 5V
;   RSS421 pin 6 (GND)  -> Teensy GND
; ---------------------------------------------------------------------------

[env]
platform = teensy
board = teensy41
framework = arduino

; Console on LPC hardware (RS41 on Serial7, enable pin 32)
[env:LPCconsole]
build_flags = 
  ${env.build_flags}
  -DRS41SERIAL=Serial7
  -DRS41EN=32
build_src_filter = 
  +<*.cpp>
  +<../examples/RS41console/*.cpp>

; Console on ECU/RATS hardware (Serial1, enable pin 2, early enable)
[env:ECUconsole]
build_flags = 
  ${env.build_flags}
  -DRS41SERIAL=Serial1
  -DRS41EN=2
  -DRATSRS41
build_src_filter = 
  +<*.cpp>
  +<../examples/RS41console/*.cpp>

; Console on RPU/RATS hardware (Serial6, enable pin 41, early enable)
[env:RPUconsole]
build_flags = 
  ${env.build_flags}
  -DRS41SERIAL=Serial6
  -DRS41EN=41
  -DRATSRS41
build_src_filter = 
  +<*.cpp>
  +<../examples/RS41console/*.cpp>

; Console on a bare Teensy 4.1 (Serial1, enable pin 2)
[env:TeensyConsole]
build_flags = 
  ${env.build_flags}
  -DRS41SERIAL=Serial1
  -DRS41EN=41
build_src_filter = 
  +<*.cpp>
  +<../examples/RS41console/*.cpp>

; CSV-to-SD logger on LPC hardware (Serial7, enable pin 32)
[env:LPCcsv]
build_flags = 
  ${env.build_flags}
  -DRS41SERIAL=Serial7
  -DRS41EN=32
build_src_filter = 
  +<*.cpp>
  +<../examples/RS41csv/*.cpp>

; CSV-to-SD logger on ECU hardware (Serial1, enable pin 2)
[env:ECUcsv]
build_flags = 
  ${env.build_flags}
  -DRS41SERIAL=Serial1
  -DRS41EN=2
build_src_filter = 
  +<*.cpp>
  +<../examples/RS41csv/*.cpp>

; USB <-> RS41 serial bridge on ECU hardware (Serial1, enable pin 2)
[env:ECUpassthru]
build_flags = 
  ${env.build_flags}
  -DRS41SERIAL=Serial1
  -DRS41EN=2
build_src_filter = 
  +<*.cpp>
  +<../examples/PassThru/*.cpp>

; USB <-> RS41 serial bridge on RPU hardware (Serial6, enable pin 41)
[env:RPUpassthru]
build_flags = 
  ${env.build_flags}
  -DRS41SERIAL=Serial6
  -DRS41EN=41
build_src_filter = 
  +<*.cpp>
  +<../examples/PassThru/*.cpp>

; USB <-> RS41 serial bridge on a bare Teensy 4.1 (Serial1, enable pin 41)
[env:TeensyPassthru]
build_flags = 
  ${env.build_flags}
  -DRS41SERIAL=Serial1
  -DRS41EN=41
build_src_filter = 
  +<*.cpp>
  +<../examples/PassThru/*.cpp>


